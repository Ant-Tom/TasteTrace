spring:
  application:
    name: tastetrace-backend
  threads:
    virtual:
      # Java 21 virtual threads: blocking JDBC and file I/O no longer pin a platform thread each.
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tastetrace}
    username: ${DB_USER:tastetrace_user}
    password: ${DB_PASSWORD:tastetrace_password}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      # Only the liveness probe; it is not routed through Caddy, so it stays internal.
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/problem+json
    min-response-size: 1KB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:30}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:14}
  # Comma-separated IPs of your reverse proxy; empty = ignore X-Forwarded-For.
  trusted-proxies: ${TRUSTED_PROXIES:}
  registration:
    rate-limit-per-hour: ${REGISTRATION_RATE_LIMIT_PER_HOUR:5}
  review:
    edit-window-hours: ${REVIEW_EDIT_WINDOW_HOURS:24}
  storage:
    # Photos are plain files; in Docker this is the photos_data volume.
    photos-dir: ${PHOTOS_DIR:./data/photos}
