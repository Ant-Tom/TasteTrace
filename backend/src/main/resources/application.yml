spring:
  application:
    name: tastetrace-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tastetrace}
    username: ${DB_USER:tastetrace_user}
    password: ${DB_PASSWORD:tastetrace_password}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:30}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:14}
  registration:
    rate-limit-per-hour: ${REGISTRATION_RATE_LIMIT_PER_HOUR:5}
  review:
    edit-window-hours: ${REVIEW_EDIT_WINDOW_HOURS:24}
  ai:
    service-base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin123}
    bucket-reviews: ${MINIO_BUCKET_REVIEWS:review-photos}
